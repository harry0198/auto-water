[package]
name = "pico2-blinky"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", features = [
    "defmt", "unstable-pac", "time-driver", "critical-section-impl",
    "rp235xa", "binary-info", "executor-thread", "executor-interrupt",
] }
cyw43 = { version = "0.7.0", features = ["defmt"] }
cyw43-pio = { version = "0.10.0" }
static_cell = "2.1"
cortex-m-rt = "0.7.0"
critical-section = "1.1"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.release]
debug = true